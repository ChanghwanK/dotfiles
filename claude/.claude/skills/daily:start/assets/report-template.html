<title>{{TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 결론 → 긴급 → 3열 보드(오늘 할 것 / 기한 있는 것 / 어제 끝낸 것, 항목마다 그 자리에서 펼침)
   → 회고 대조 → 알럿(시간축 막대) → 메일·근본 원인·일정. 단일 라이트 테마(전역 CLAUDE.md Artifact 절) */
:root {
  --bg: #ffffff;
  --fg: #1b2430;
  --muted: #5d6b7a;
  --line: #dde3ea;
  --soft: #f1f4f7;
  --accent: #2f5d8a;
  --red: #b42318; --red-bg: #fdecea;
  --amber: #8a5a00; --amber-bg: #fff4d6;
  --green: #1d6b3a; --green-bg: #e5f4ea;
  --font-head: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font: 14px/1.6 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1440px; margin: 0 auto; padding-block: 28px 48px; display: grid; gap: 28px; }
h1, h2, h3, h4 { font-family: var(--font-head); text-wrap: balance; margin: 0; }
h1 { font-size: 26px; font-weight: 700; }
h2 { font-size: 17px; font-weight: 600; display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; }
h2 .n { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-weight: 400; }
h3 { font-size: 14px; font-weight: 600; }
a { color: var(--accent); }
a:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; color: var(--muted); letter-spacing: .04em; }
.lede { font-size: 16px; margin: 6px 0 0; max-width: 72ch; }
.lede-list { font-size: 15px; margin: 8px 0 0; padding-left: 20px; max-width: 72ch; display: grid; gap: 2px; }
.muted { color: var(--muted); }
.note { font-size: 13px; color: var(--muted); margin: 0; }
section { display: grid; gap: 12px; min-width: 0; border-top: 1px solid var(--line); padding-top: 20px; }


.chip { display: inline-block; font-size: 11px; font-weight: 500; line-height: 1; padding: 4px 7px; border-radius: 4px; white-space: nowrap; vertical-align: 1px; }
.chip.red { color: var(--red); background: var(--red-bg); }
.chip.amber { color: var(--amber); background: var(--amber-bg); }
.chip.green { color: var(--green); background: var(--green-bg); }
.chip.gray { color: var(--muted); background: var(--soft); }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { background: var(--soft); font-weight: 500; color: var(--muted); font-size: 12px; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }

.urgent-list { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.urgent-list li { border-left: 3px solid var(--red); padding: 2px 0 2px 12px; }
.calm { border-left: 3px solid var(--green); padding: 2px 0 2px 12px; margin: 0; }

/* 3열 보드 */
.board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
.col { display: grid; gap: 8px; min-width: 0; }
.col-head { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 6px; border-bottom: 2px solid var(--fg); }
.col-head h3 { font-size: 14px; }
.col-head .mono { font-size: 12px; color: var(--muted); }
.col.wait .col-head { border-bottom-color: #d9a43a; }
.info { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; margin-left: 4px; border-radius: 50%; border: 1px solid var(--muted); color: var(--muted); font: 600 10px/1 var(--font-mono); cursor: help; vertical-align: 2px; }
.info:hover, .info:focus-visible { border-color: var(--accent); color: var(--accent); outline: none; }
.info::after { content: attr(data-tip); position: absolute; left: 50%; top: calc(100% + 8px); transform: translateX(-50%); width: 280px; max-width: 80vw; padding: 9px 11px; background: var(--fg); color: var(--bg); font: 400 12px/1.55 var(--font-body); border-radius: 6px; white-space: normal; text-align: left; opacity: 0; visibility: hidden; pointer-events: none; z-index: 20; }
.info:hover::after, .info:focus-visible::after { opacity: 1; visibility: visible; }
@media (prefers-reduced-motion: no-preference) { .info::after { transition: opacity .12s; } }
.col.done .col-head { border-bottom-color: #7fb08f; }
.sub { font-size: 12px; color: var(--muted); margin: 8px 0 0; letter-spacing: .02em; }
.empty { font-size: 13px; color: var(--muted); padding: 8px 0; }

.item { border: 1px solid var(--line); border-radius: 6px; background: var(--bg); min-width: 0; }
.item[open] { border-color: #b9c6d4; }
.item.first { border-color: var(--accent); }
.item summary { list-style: none; cursor: pointer; padding: 10px 12px; display: grid; gap: 4px; }
.item summary::-webkit-details-marker { display: none; }
.item .row { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; }
.item .ttl { font-weight: 600; font-size: 13.5px; min-width: 0; overflow-wrap: anywhere; }
.item .ttl .rk { font-family: var(--font-mono); color: var(--accent); margin-right: 4px; }
.item .chips { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; flex: none; }
.item .s { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.caret { display: inline-block; width: 12px; color: var(--muted); font-size: 9px; transition: transform .15s; vertical-align: 1px; }
.item[open] > summary .caret { transform: rotate(90deg); }
.dl { display: grid; grid-template-columns: 68px minmax(0, 1fr); gap: 4px 10px; font-size: 12.5px; margin: 0 12px 12px; padding-top: 10px; border-top: 1px dashed var(--line); }
.dl dt { color: var(--muted); }
.dl dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.dl dd.strong { font-weight: 600; }
.cmd { display: flex; gap: 6px; align-items: flex-start; min-width: 0; }
.cmd code { font-family: var(--font-mono); font-size: 11px; background: var(--soft); border: 1px solid var(--line); padding: 2px 6px; border-radius: 4px; overflow-wrap: anywhere; flex: 1; min-width: 0; }
.copy { font: 12px var(--font-body); border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 4px; padding: 2px 8px; cursor: pointer; white-space: nowrap; }
.copy:hover { border-color: var(--accent); }
.launch { margin: 0 12px 12px; padding-top: 10px; border-top: 1px dashed var(--line); display: grid; gap: 6px; font-size: 12.5px; }
.launch .where { color: var(--muted); overflow-wrap: anywhere; }
.launch .btns { display: flex; gap: 6px; flex-wrap: wrap; }
.go { font: 500 12.5px var(--font-body); border: 1px solid var(--accent); background: var(--bg); color: var(--accent); border-radius: 4px; padding: 4px 10px; cursor: pointer; }
.go:hover { background: var(--soft); }
.launch code { font-family: var(--font-mono); font-size: 11px; background: var(--soft); border: 1px solid var(--line); padding: 2px 6px; border-radius: 4px; overflow-wrap: anywhere; }
.prs { display: flex; flex-wrap: wrap; gap: 4px 8px; font-family: var(--font-mono); font-size: 12px; }
.toolbar { display: flex; gap: 8px; justify-content: flex-end; }
.head-r { display: inline-flex; align-items: center; gap: 8px; }
.add-btn { font: 500 12px var(--font-body); border: 1px solid var(--line); background: var(--bg); color: var(--accent); border-radius: 4px; padding: 2px 8px; cursor: pointer; }
.add-btn:hover:not([disabled]) { border-color: var(--accent); }
.add-btn[disabled] { color: var(--muted); cursor: not-allowed; }
.user-items { display: grid; gap: 8px; }
.user-items:not(:empty)::before { content: "직접 추가"; font-size: 12px; color: var(--muted); margin-top: 6px; }
.md { margin: 0 12px 12px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: 13px; overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md h1, .md h2, .md h3 { font-size: 14px; margin: 10px 0 4px; }
.md p, .md ul, .md ol { margin: 6px 0; } .md ul, .md ol { padding-left: 20px; }
.md code { font-family: var(--font-mono); font-size: 12px; background: var(--soft); padding: 1px 4px; border-radius: 3px; }
.md pre { background: var(--soft); border: 1px solid var(--line); border-radius: 4px; padding: 8px; overflow-x: auto; }
.md pre code { background: none; padding: 0; }
.item-actions { margin: 0 12px 12px; display: flex; justify-content: flex-end; }
.del { font: 12px var(--font-body); border: 1px solid var(--line); background: var(--bg); color: var(--muted); border-radius: 4px; padding: 2px 8px; cursor: pointer; }
.del.armed { color: var(--red); border-color: var(--red); }
.modal-bg { position: fixed; inset: 0; background: rgba(27, 36, 48, .35); display: flex; align-items: flex-start; justify-content: center; padding: max(48px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); z-index: 50; overflow-y: auto; }
.modal { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; width: min(640px, 100%); padding: 18px; display: grid; gap: 10px; }
.modal textarea { width: 100%; font: 13px/1.55 var(--font-mono); border: 1px solid var(--line); border-radius: 6px; padding: 10px; resize: vertical; color: var(--fg); background: var(--bg); }
.modal textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.md-preview { border: 1px solid var(--line); border-radius: 6px; padding: 10px; min-height: 44px; font-size: 13px; background: var(--soft); overflow-wrap: anywhere; }
.md-preview:empty::before { content: "미리보기"; color: var(--muted); }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
.ghost { font: 500 12.5px var(--font-body); border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 4px; padding: 4px 10px; cursor: pointer; }
.err { color: var(--red); }
.check { display: flex; gap: 6px; align-items: baseline; font-size: 13px; cursor: pointer; flex-wrap: wrap; }
.chips a.chip { text-decoration: none; }
/* 완료 체크: 페이지 DB(item_state)에 저장, 재게시·새로고침 후에도 유지 */
.done-btn { display: inline-flex; align-items: center; gap: 4px; font: 500 11px/1 var(--font-body); border: 1px solid var(--line); background: var(--bg); color: var(--muted); border-radius: 4px; padding: 3px 7px; cursor: pointer; white-space: nowrap; }
.done-btn::before { content: ""; width: 9px; height: 9px; border: 1.5px solid currentColor; border-radius: 2px; }
.done-btn:hover:not([disabled]) { border-color: var(--green); color: var(--green); }
.done-btn[aria-pressed="true"] { color: var(--green); background: var(--green-bg); border-color: var(--green-bg); }
.done-btn[aria-pressed="true"]::before { background: currentColor; }
.done-btn[disabled] { cursor: not-allowed; opacity: .6; }
.item.is-done { background: var(--soft); }
.item.is-done .ttl { color: var(--muted); text-decoration: line-through; text-decoration-color: #9aa6b2; }
.item.is-done .s { opacity: .7; }
.done-count { font-family: var(--font-mono); font-size: 12px; color: var(--green); }
.toolbar button { font: 12px var(--font-body); border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 4px; padding: 3px 10px; cursor: pointer; }

@media (max-width: 820px) { .board { grid-template-columns: 1fr; } }

.chart { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; padding: 10px 8px 4px; }
.chart svg { display: block; min-width: 560px; width: 100%; height: auto; font-family: var(--font-mono); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
ul.plain { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 28px; }
.two > div { display: grid; gap: 10px; align-content: start; min-width: 0; }
footer { font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 4px; }
@media (prefers-reduced-motion: reduce) { .caret { transition: none; } }
</style>

<div class="wrap" id="app"></div>

<div class="modal-bg" id="add-modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="add-title">
    <h3 id="add-title">항목 추가</h3>
    <p class="note" id="add-col-label"></p>
    <label class="note" for="add-text">Markdown으로 씁니다. 첫 줄이 제목이 되고, 전체 내용은 펼치면 보입니다.</label>
    <textarea id="add-text" rows="10" placeholder="# 시크릿 분리 기준 표준 초안 리뷰 요청&#10;&#10;- 대상: OAuth 묶음, 서명 키 분리&#10;- 기한: 11-25"></textarea>
    <div class="md-preview" id="add-preview" aria-live="polite"></div>
    <label class="check"><input type="checkbox" id="add-jira"> Jira 티켓도 만들기 <span class="note">("보드 반영해" 때 초안을 보여 드리고 승인받은 뒤 PLE에 만듭니다)</span></label>
    <p class="note err" id="add-err" hidden></p>
    <div class="modal-actions">
      <button type="button" class="ghost" id="add-cancel">취소</button>
      <button type="button" class="go" id="add-save">추가</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>

<script id="report-data" type="application/json">/*__DATA__*/null</script>
<script>
(function () {
  "use strict";
  var raw = document.getElementById("report-data").textContent;
  var D;
  try { D = JSON.parse(raw); } catch (e) { D = null; }
  var app = document.getElementById("app");
  if (!D) { app.textContent = "브리핑 데이터를 읽지 못했습니다. render-report.py로 데이터를 넣었는지 확인하세요."; return; }

  var STATUS_CHIP = { "완료": "green", "진행 중": "amber", "중단": "red" };
  var TAG_CHIP = { "긴급": "red", "필수": "amber", "이어서": "gray", "검토": "gray" };
  var SEV_RANK = { CRITICAL: 4, MAJOR: 3, WARNING: 2, MINOR: 1, INFO: 0 };
  var WAIT_DAYS = 3; // 기한이 이 일수 안이거나 지난 메일 할 일은 '기한 있는 것' 칸에 올린다
  var WAIT_TIP = "오늘 이어가기와 별개로 기한이 정해진 일입니다. Notion 활성 Task 중 오늘 마감이거나 마감이 지난 지 7일 안인 것, 메일 할 일 중 기한이 " + WAIT_DAYS + "일 안이거나 이미 지난 것을 모읍니다.";

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function chip(text, tone) { return '<span class="chip ' + (tone || "gray") + '">' + esc(text) + "</span>"; }
  function link(url, text) { return url ? '<a href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(text) + "</a>" : ""; }
  function arr(x) { return Array.isArray(x) ? x : []; }
  function sevTone(s) { var r = SEV_RANK[(s || "").toUpperCase()]; return r >= 3 ? "red" : r === 2 ? "amber" : "gray"; }
  function stateTone(s) { return s === "resolved" ? "green" : s === "firing" ? "red" : "amber"; }

  var cmdSeq = 0;
  function resumeHtml(resume) {
    if (!resume) return "";
    if (/^https?:\/\//.test(resume)) return link(resume, resume.replace(/^https?:\/\/(www\.)?github\.com\//, ""));
    var id = "cmd-" + (cmdSeq++);
    return '<div class="cmd"><code id="' + id + '">' + esc(resume) + '</code><button class="copy" type="button" data-target="' + id + '">복사</button></div>';
  }
  // 이어가기 버튼: resolve-launch.py가 계산한 Orca 채팅 실행 명령을 의도별로 복사한다
  var INTENTS = ["구체화", "실행"];
  function launchHtml(t) {
    if (!t.launch) return t.launch_error ? '<div class="launch"><span class="where">이어가기 명령 없음: ' + esc(t.launch_error) + "</span></div>" : "";
    var L = t.launch;
    var where = L.mode === "agent launch"
      ? "열 곳: 기존 워크스페이스 " + L.name
      : "열 곳: 새 워크스페이스 " + L.name + " (지난 워크스페이스가 없어 " + L.target + "에서 새로 만듭니다)";
    var btns = INTENTS.filter(function (k) { return L[k]; }).map(function (k) {
      var id = "cmd-" + (cmdSeq++);
      return '<button class="go copy" type="button" data-target="' + id + '" data-label="' + esc(k) + '로 이어가기">' + esc(k) + "로 이어가기</button>" +
        '<code id="' + id + '" hidden>' + esc(L[k]) + "</code>";
    }).join("");
    return '<div class="launch"><span class="where">' + esc(where) + '</span><div class="btns">' + btns +
      '</div><span class="where">복사한 명령을 터미널에 붙여넣으면 Orca 채팅이 열리고 /task:resume으로 이어집니다</span></div>';
  }
  function prsHtml(prs) {
    return arr(prs).length ? '<div class="prs">' + arr(prs).map(function (p) { return link(p.url, "#" + p.number); }).join("") + "</div>" : "";
  }
  // dl 행: [라벨, html, strong] 중 값이 있는 것만
  function dl(rows) {
    var body = rows.filter(function (r) { return r[1]; }).map(function (r) {
      return "<dt>" + esc(r[0]) + '</dt><dd class="' + (r[2] ? "strong" : "") + '">' + r[1] + "</dd>";
    }).join("");
    return body ? '<dl class="dl">' + body + "</dl>" : "";
  }
  // 완료 체크 키: 어제 스레드에서 온 항목은 스레드 id, 아니면 Top 3 순번. doc id로 쓰므로 영숫자와 하이픈만
  var DONE_KEYS = {}; // key -> title (DB에 함께 저장해 Claude가 읽을 때 무엇인지 알 수 있게)
  function doneKey(prefix, id) { return (prefix + "-" + String(id)).replace(/[^A-Za-z0-9-]/g, "-"); }
  function doneBtn(key) {
    return '<button type="button" class="done-btn" data-done="' + esc(key) + '" aria-pressed="false" disabled title="저장소에 연결하는 중">완료</button>';
  }
  // 펼침 항목 하나
  function item(opts) {
    var details = opts.details || "";
    if (opts.key) DONE_KEYS[opts.key] = opts.title;
    var head = '<span class="row"><span class="ttl">' + (details ? '<span class="caret" aria-hidden="true">&#9654;</span>' : "") +
      (opts.rank ? '<span class="rk">' + esc(opts.rank) + "</span>" : "") + esc(opts.title) + "</span>" +
      '<span class="chips">' + (opts.chips || "") + (opts.key ? doneBtn(opts.key) : "") + "</span></span>" +
      (opts.sub ? '<span class="s">' + esc(opts.sub) + "</span>" : "");
    var cls = "item" + (opts.first ? " first" : "");
    var keyAttr = opts.key ? ' data-key="' + esc(opts.key) + '"' : "";
    if (!details) return '<div class="' + cls + '"' + keyAttr + '><div class="summary-static" style="padding:10px 12px;display:grid;gap:4px">' + head + "</div></div>";
    return '<details class="' + cls + '"' + keyAttr + (opts.open ? " open" : "") + "><summary>" + head + "</summary>" + details + "</details>";
  }
  // "11-24" 또는 "2026-11-24"를 기준일과의 일수 차이로
  function dayDiff(due) {
    if (!due) return null;
    var m = /(?:(\d{4})-)?(\d{1,2})-(\d{1,2})/.exec(due);
    var b = /(\d{4})-(\d{2})-(\d{2})/.exec(D.date || "");
    if (!m || !b) return null;
    var base = Date.UTC(+b[1], +b[2] - 1, +b[3]);
    var d = Date.UTC(m[1] ? +m[1] : +b[1], +m[2] - 1, +m[3]);

    btn.disabled = true;
    doneState[key] = next; applyDone(); // 낙관적 반영, 실패하면 되돌린다
    // set은 문서를 통째로 바꾸므로, 보드 반영이 남긴 ledger를 그대로 실어 보낸다(지우면 체크 해제가 일지에 반영되지 않는다)
    var rec = { key: key, title: DONE_KEYS[key] || "", done: next, doneAt: next ? Date.now() : null, date: D.date };
    if (stateLedger[key]) rec.ledger = stateLedger[key];
    store.collection(STATE).doc(key).set(rec)
      .then(function () { btn.disabled = false; }, function () {
        doneState[key] = !next; applyDone();
        btn.disabled = false; btn.title = "저장하지 못했습니다. 편집 권한이 있는지 확인해 주세요";
      });
  }
  app.addEventListener("click", function (ev) {
    var btn = ev.target.closest && ev.target.closest("[data-done]");
    if (!btn) return;
    ev.preventDefault(); // summary 안 버튼이라 펼침 토글을 막는다
    ev.stopPropagation();
    if (!btn.disabled && store) toggleDone(btn);
  });

  (function connect() {
    if (!window.claude || typeof window.claude.use !== "function") {
      app.querySelectorAll("[data-add]").forEach(function (b) { b.title = "claude.ai에서 열었을 때만 추가할 수 있습니다"; });
      app.querySelectorAll("[data-done]").forEach(function (b) { b.title = "claude.ai에서 열었을 때만 체크할 수 있습니다"; });
      return;
    }
    window.claude.use("db").then(function (db) {
      var btns = app.querySelectorAll("[data-add]");
      var dbtns = app.querySelectorAll("[data-done]");
      if (!db) {
        btns.forEach(function (b) { b.title = "이 보기에서는 저장할 수 없습니다(로그인 필요)"; });
        dbtns.forEach(function (b) { b.title = "이 보기에서는 저장할 수 없습니다(로그인 필요)"; });
        return;
      }
      store = db;
      btns.forEach(function (b) { b.disabled = false; b.title = "Markdown으로 항목 추가"; });
      dbtns.forEach(function (b) { b.disabled = false; b.title = "완료로 표시하거나 해제합니다"; });
      db.collection(ITEMS).orderBy("createdAt", "asc").onSnapshot(function (snap) { renderUserItems(snap.docs); }, function () {
        app.querySelectorAll(".user-items").forEach(function (el) { el.setAttribute("data-err", "1"); });
      });
      db.collection(STATE).onSnapshot(function (snap) {
        doneState = {}; stateLedger = {};
        snap.docs.forEach(function (d) {
          var v = d.data() || {};
          if (v.done) doneState[d.id] = true;
          if (v.ledger) stateLedger[d.id] = v.ledger;
        });
        applyDone();
      }, function () {});
    }, function () {});
  })();

  app.addEventListener("click", function (ev) {
    var acc = ev.target.closest && ev.target.closest("[data-acc]");
    if (acc) {
      var open = acc.getAttribute("data-acc") === "open";
      app.querySelectorAll(".board details.item").forEach(function (d) { d.open = open; });
      return;
    }
    var btn = ev.target.closest && ev.target.closest(".copy");
    if (!btn) return;
    ev.preventDefault();
    var el = document.getElementById(btn.getAttribute("data-target"));
    if (!el) return;
    var text = el.textContent;
    var label = btn.getAttribute("data-label") || "복사";
    function selectFallback() {
      el.hidden = false;
      var r = document.createRange(); r.selectNodeContents(el);
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
      btn.textContent = "선택됨";
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { btn.textContent = "복사됨"; }, selectFallback);
    } else { selectFallback(); }
    setTimeout(function () { btn.textContent = label; }, 1600);
  });

  // 밤사이 시간대별 알럿: 열림은 빨강, 해결은 회색으로 쌓는다
  function hourlySvg(hs) {
    var W = 940, H = 170, left = 30, bottom = 24, top = 14;
    var n = hs.length, slot = (W - left - 8) / n, bw = Math.min(34, slot * 0.62);
    var max = Math.max.apply(null, hs.map(function (h) { return (h.open || 0) + (h.resolved || 0); }).concat([1]));
    var step = max <= 5 ? 1 : max <= 10 ? 2 : max <= 25 ? 5 : 10;
    var ymax = Math.ceil(max / step) * step;
    function y(v) { return H - bottom - v / ymax * (H - bottom - top); }
    var g = ['<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="시간대별 알럿 수">'];
    for (var v = 0; v <= ymax; v += step) {
      g.push('<line x1="' + left + '" y1="' + y(v) + '" x2="' + (W - 8) + '" y2="' + y(v) + '" stroke="#eef1f5" stroke-width="1"/>');
      g.push('<text x="' + (left - 6) + '" y="' + (y(v) + 3) + '" font-size="10" fill="#5d6b7a" text-anchor="end">' + v + "</text>");
    }
    hs.forEach(function (h, i) {
      var cx = left + slot * i + slot / 2, x0 = cx - bw / 2;
      var res = h.resolved || 0, open = h.open || 0;
      if (res) g.push('<rect x="' + x0 + '" y="' + y(res) + '" width="' + bw + '" height="' + (y(0) - y(res)) + '" fill="#b8c3cf"><title>' + esc(h.hour) + "시 해결 " + res + "</title></rect>");
      if (open) g.push('<rect x="' + x0 + '" y="' + y(res + open) + '" width="' + bw + '" height="' + (y(res) - y(res + open)) + '" fill="#c4584d"><title>' + esc(h.hour) + "시 열림 " + open + "</title></rect>");
      if ((SEV_RANK[(h.max_severity || "").toUpperCase()] || 0) >= 3) g.push('<circle cx="' + cx + '" cy="' + (y(res + open) - 7) + '" r="3" fill="#b42318"/>');
      g.push('<text x="' + cx + '" y="' + (H - 8) + '" font-size="10" fill="#5d6b7a" text-anchor="middle">' + esc(h.hour) + "</text>");
    });
    g.push("</svg>");
    return '<div class="chart">' + g.join("") + "</div>";
  }
})();
</script>
