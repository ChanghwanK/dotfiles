<title>{{TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 결론 → 긴급 → 3열 보드(오늘 할 것 / 기한 있는 것 / 어제 끝낸 것, 항목마다 그 자리에서 펼침)
   → 회고 대조 → 알럿(시간축 막대) → 메일·근본 원인·일정. 단일 라이트 테마(전역 CLAUDE.md Artifact 절) */
:root {
  --bg: #ffffff;
  --fg: #1b2430;
  --muted: #5d6b7a;
  --line: #dde3ea;
  --soft: #f1f4f7;
  --accent: #2f5d8a;
  --red: #b42318; --red-bg: #fdecea;
  --amber: #8a5a00; --amber-bg: #fff4d6;
  --green: #1d6b3a; --green-bg: #e5f4ea;
  --font-head: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font: 14px/1.6 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1440px; margin: 0 auto; padding-block: 28px 48px; display: grid; gap: 28px; }
h1, h2, h3, h4 { font-family: var(--font-head); text-wrap: balance; margin: 0; }
h1 { font-size: 26px; font-weight: 700; }
h2 { font-size: 17px; font-weight: 600; display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; }
h2 .n { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-weight: 400; }
h3 { font-size: 14px; font-weight: 600; }
a { color: var(--accent); }
a:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; color: var(--muted); letter-spacing: .04em; }
.lede { font-size: 16px; margin: 6px 0 0; max-width: 72ch; }
.lede-list { font-size: 15px; margin: 8px 0 0; padding-left: 20px; max-width: 72ch; display: grid; gap: 2px; }
.muted { color: var(--muted); }
.note { font-size: 13px; color: var(--muted); margin: 0; }
section { display: grid; gap: 12px; min-width: 0; border-top: 1px solid var(--line); padding-top: 20px; }


.chip { display: inline-block; font-size: 11px; font-weight: 500; line-height: 1; padding: 4px 7px; border-radius: 4px; white-space: nowrap; vertical-align: 1px; }
.chip.red { color: var(--red); background: var(--red-bg); }
.chip.amber { color: var(--amber); background: var(--amber-bg); }
.chip.green { color: var(--green); background: var(--green-bg); }
.chip.gray { color: var(--muted); background: var(--soft); }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { background: var(--soft); font-weight: 500; color: var(--muted); font-size: 12px; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }

.urgent-list { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.urgent-list li { border-left: 3px solid var(--red); padding: 2px 0 2px 12px; }
.calm { border-left: 3px solid var(--green); padding: 2px 0 2px 12px; margin: 0; }

/* 3열 보드 */
.board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
.col { display: grid; gap: 8px; min-width: 0; }
.col-head { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 6px; border-bottom: 2px solid var(--fg); }
.col-head h3 { font-size: 14px; }
.col-head .mono { font-size: 12px; color: var(--muted); }
.col.wait .col-head { border-bottom-color: #d9a43a; }
.info { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; margin-left: 4px; border-radius: 50%; border: 1px solid var(--muted); color: var(--muted); font: 600 10px/1 var(--font-mono); cursor: help; vertical-align: 2px; }
.info:hover, .info:focus-visible { border-color: var(--accent); color: var(--accent); outline: none; }
.info::after { content: attr(data-tip); position: absolute; left: 50%; top: calc(100% + 8px); transform: translateX(-50%); width: 280px; max-width: 80vw; padding: 9px 11px; background: var(--fg); color: var(--bg); font: 400 12px/1.55 var(--font-body); border-radius: 6px; white-space: normal; text-align: left; opacity: 0; visibility: hidden; pointer-events: none; z-index: 20; }
.info:hover::after, .info:focus-visible::after { opacity: 1; visibility: visible; }
@media (prefers-reduced-motion: no-preference) { .info::after { transition: opacity .12s; } }
.col.done .col-head { border-bottom-color: #7fb08f; }
.sub { font-size: 12px; color: var(--muted); margin: 8px 0 0; letter-spacing: .02em; }
.empty { font-size: 13px; color: var(--muted); padding: 8px 0; }

.item { border: 1px solid var(--line); border-radius: 6px; background: var(--bg); min-width: 0; }
.item[open] { border-color: #b9c6d4; }
.item.first { border-color: var(--accent); }
.item summary { list-style: none; cursor: pointer; padding: 10px 12px; display: grid; gap: 4px; }
.item summary::-webkit-details-marker { display: none; }
.item .row { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; }
.item .ttl { font-weight: 600; font-size: 13.5px; min-width: 0; overflow-wrap: anywhere; }
.item .ttl .rk { font-family: var(--font-mono); color: var(--accent); margin-right: 4px; }
.item .chips { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; flex: none; }
.item .s { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.caret { display: inline-block; width: 12px; color: var(--muted); font-size: 9px; transition: transform .15s; vertical-align: 1px; }
.item[open] > summary .caret { transform: rotate(90deg); }
.dl { display: grid; grid-template-columns: 68px minmax(0, 1fr); gap: 4px 10px; font-size: 12.5px; margin: 0 12px 12px; padding-top: 10px; border-top: 1px dashed var(--line); }
.dl dt { color: var(--muted); }
.dl dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.dl dd.strong { font-weight: 600; }
.cmd { display: flex; gap: 6px; align-items: flex-start; min-width: 0; }
.cmd code { font-family: var(--font-mono); font-size: 11px; background: var(--soft); border: 1px solid var(--line); padding: 2px 6px; border-radius: 4px; overflow-wrap: anywhere; flex: 1; min-width: 0; }
.copy { font: 12px var(--font-body); border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 4px; padding: 2px 8px; cursor: pointer; white-space: nowrap; }
.copy:hover { border-color: var(--accent); }
.launch { margin: 0 12px 12px; padding-top: 10px; border-top: 1px dashed var(--line); display: grid; gap: 6px; font-size: 12.5px; }
.launch .where { color: var(--muted); overflow-wrap: anywhere; }
.launch .btns { display: flex; gap: 6px; flex-wrap: wrap; }
.go { font: 500 12.5px var(--font-body); border: 1px solid var(--accent); background: var(--bg); color: var(--accent); border-radius: 4px; padding: 4px 10px; cursor: pointer; }
.go:hover { background: var(--soft); }
.launch code { font-family: var(--font-mono); font-size: 11px; background: var(--soft); border: 1px solid var(--line); padding: 2px 6px; border-radius: 4px; overflow-wrap: anywhere; }
.prs { display: flex; flex-wrap: wrap; gap: 4px 8px; font-family: var(--font-mono); font-size: 12px; }
.toolbar { display: flex; gap: 8px; justify-content: flex-end; }
.head-r { display: inline-flex; align-items: center; gap: 8px; }
.add-btn { font: 500 12px var(--font-body); border: 1px solid var(--line); background: var(--bg); color: var(--accent); border-radius: 4px; padding: 2px 8px; cursor: pointer; }
.add-btn:hover:not([disabled]) { border-color: var(--accent); }
.add-btn[disabled] { color: var(--muted); cursor: not-allowed; }
.user-items { display: grid; gap: 8px; }
.user-items:not(:empty)::before { content: "직접 추가"; font-size: 12px; color: var(--muted); margin-top: 6px; }
.md { margin: 0 12px 12px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: 13px; overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md h1, .md h2, .md h3 { font-size: 14px; margin: 10px 0 4px; }
.md p, .md ul, .md ol { margin: 6px 0; } .md ul, .md ol { padding-left: 20px; }
.md code { font-family: var(--font-mono); font-size: 12px; background: var(--soft); padding: 1px 4px; border-radius: 3px; }
.md pre { background: var(--soft); border: 1px solid var(--line); border-radius: 4px; padding: 8px; overflow-x: auto; }
.md pre code { background: none; padding: 0; }
.item-actions { margin: 0 12px 12px; display: flex; justify-content: flex-end; }
.del { font: 12px var(--font-body); border: 1px solid var(--line); background: var(--bg); color: var(--muted); border-radius: 4px; padding: 2px 8px; cursor: pointer; }
.del.armed { color: var(--red); border-color: var(--red); }
.modal-bg { position: fixed; inset: 0; background: rgba(27, 36, 48, .35); display: flex; align-items: flex-start; justify-content: center; padding: max(48px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); z-index: 50; overflow-y: auto; }
.modal { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; width: min(640px, 100%); padding: 18px; display: grid; gap: 10px; }
.modal textarea { width: 100%; font: 13px/1.55 var(--font-mono); border: 1px solid var(--line); border-radius: 6px; padding: 10px; resize: vertical; color: var(--fg); background: var(--bg); }
.modal textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.md-preview { border: 1px solid var(--line); border-radius: 6px; padding: 10px; min-height: 44px; font-size: 13px; background: var(--soft); overflow-wrap: anywhere; }
.md-preview:empty::before { content: "미리보기"; color: var(--muted); }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
.ghost { font: 500 12.5px var(--font-body); border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 4px; padding: 4px 10px; cursor: pointer; }
.err { color: var(--red); }
.check { display: flex; gap: 6px; align-items: baseline; font-size: 13px; cursor: pointer; flex-wrap: wrap; }
.chips a.chip { text-decoration: none; }
/* 완료 체크: 페이지 DB(item_state)에 저장, 재게시·새로고침 후에도 유지 */
.done-btn { display: inline-flex; align-items: center; gap: 4px; font: 500 11px/1 var(--font-body); border: 1px solid var(--line); background: var(--bg); color: var(--muted); border-radius: 4px; padding: 3px 7px; cursor: pointer; white-space: nowrap; }
.done-btn::before { content: ""; width: 9px; height: 9px; border: 1.5px solid currentColor; border-radius: 2px; }
.done-btn:hover:not([disabled]) { border-color: var(--green); color: var(--green); }
.done-btn[aria-pressed="true"] { color: var(--green); background: var(--green-bg); border-color: var(--green-bg); }
.done-btn[aria-pressed="true"]::before { background: currentColor; }
.done-btn[disabled] { cursor: not-allowed; opacity: .6; }
.item.is-done { background: var(--soft); }
.item.is-done .ttl { color: var(--muted); text-decoration: line-through; text-decoration-color: #9aa6b2; }
.item.is-done .s { opacity: .7; }
.done-count { font-family: var(--font-mono); font-size: 12px; color: var(--green); }
.toolbar button { font: 12px var(--font-body); border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 4px; padding: 3px 10px; cursor: pointer; }
/* 칸반: 할 일 / 진행 중 / 완료. 카드는 드래그나 상태 메뉴로 옮긴다 */
.cards { display: grid; gap: 8px; min-height: 44px; align-content: start; }
.cards:empty::before { content: "비어 있음"; font-size: 12px; color: var(--muted); padding: 8px 0; }
.col { border-radius: 6px; }
.col.over { outline: 2px dashed var(--accent); outline-offset: 4px; }
.col.col-doing .col-head { border-bottom-color: var(--accent); }
.col.col-done .col-head { border-bottom-color: #7fb08f; }
.item.dragging { opacity: .45; }
.status-sel { font: 500 11px var(--font-body); border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--fg); padding: 2px 4px; cursor: pointer; }
.status-sel:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.status-sel[disabled] { opacity: .6; cursor: not-allowed; }
.yday { border-top: 1px dashed var(--line); padding-top: 8px; display: grid; gap: 8px; }
.yday > summary { cursor: pointer; font-size: 12px; color: var(--muted); list-style: none; }
.yday > summary::-webkit-details-marker { display: none; }
.yday > summary::before { content: "\25B6"; font-size: 9px; margin-right: 6px; display: inline-block; transition: transform .15s; }
.yday[open] > summary::before { transform: rotate(90deg); }
/* 상태 반영: 완료 체크와 일지가 다른 항목을 카드로 확인하고 확정한다. Claude 앱(notion-personal MCP)이면 즉시 체크, 아니면 pending */
.toolbar { align-items: center; flex-wrap: wrap; }
.toolbar .sync-hint { font-size: 12px; color: var(--muted); margin-right: auto; }
.toolbar button.sync-open { border-color: var(--accent); color: var(--accent); font-weight: 500; }
.toolbar button.sync-open[disabled] { border-color: var(--line); color: var(--muted); cursor: not-allowed; }
.sync-cards { display: grid; gap: 8px; max-height: 60vh; overflow-y: auto; }
.sync-card { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; display: grid; gap: 6px; min-width: 0; }
.sync-card.off { background: var(--soft); }
.sync-card .top { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; }
.sync-card label { display: flex; gap: 8px; align-items: baseline; font-weight: 600; font-size: 13.5px; min-width: 0; overflow-wrap: anywhere; cursor: pointer; }
.sync-card.off label { cursor: default; color: var(--muted); }
.sync-card .journal { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.sync-card .journal b { font-weight: 500; color: var(--fg); }
.diff { display: inline-flex; gap: 6px; align-items: center; font-family: var(--font-mono); font-size: 12px; white-space: nowrap; }
.diff .from { color: var(--muted); background: var(--soft); padding: 2px 6px; border-radius: 4px; text-decoration: line-through; }
.diff .to { color: var(--green); background: var(--green-bg); padding: 2px 6px; border-radius: 4px; }
.diff .to.un { color: var(--amber); background: var(--amber-bg); }
.sync-card .result { font-size: 12.5px; }

@media (max-width: 820px) { .board { grid-template-columns: 1fr; } }

.chart { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; padding: 10px 8px 4px; }
.chart svg { display: block; min-width: 560px; width: 100%; height: auto; font-family: var(--font-mono); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
ul.plain { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
/* 어제 Tomorrow 하위 항목: 일지 체크 상태를 그대로 보이는 읽기 전용 체크리스트 */
.subs { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; }
.subs li { display: flex; gap: 6px; align-items: baseline; min-width: 0; overflow-wrap: anywhere; }
.subs li::before { content: ""; flex: none; width: 9px; height: 9px; border: 1.5px solid var(--muted); border-radius: 2px; transform: translateY(1px); }
.subs li.on { color: var(--muted); text-decoration: line-through; text-decoration-color: #9aa6b2; }
.subs li.on::before { background: var(--green); border-color: var(--green); }
.subs .tm-head { font-weight: 600; }
.subs .tm-head::before { display: none; }
td .chip + .chip { margin-left: 4px; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 28px; }
.two > div { display: grid; gap: 10px; align-content: start; min-width: 0; }
footer { font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 4px; }
@media (prefers-reduced-motion: reduce) { .caret { transition: none; } }
</style>

<div class="wrap" id="app"></div>

<div class="modal-bg" id="add-modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="add-title">
    <h3 id="add-title">항목 추가</h3>
    <p class="note" id="add-col-label"></p>
    <label class="note" for="add-text">Markdown으로 씁니다. 첫 줄이 제목이 되고, 전체 내용은 펼치면 보입니다.</label>
    <textarea id="add-text" rows="10" placeholder="# 시크릿 분리 기준 표준 초안 리뷰 요청&#10;&#10;- 대상: OAuth 묶음, 서명 키 분리&#10;- 기한: 11-25"></textarea>
    <div class="md-preview" id="add-preview" aria-live="polite"></div>
    <label class="check"><input type="checkbox" id="add-jira"> Jira 티켓도 만들기 <span class="note">("보드 반영해" 때 초안을 보여 드리고 승인받은 뒤 PLE에 만듭니다)</span></label>

</div>

<div class="modal-bg" id="sync-modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="sync-title">
    <h3 id="sync-title">Notion 일지에 상태 반영</h3>
    <p class="note" id="sync-sub"></p>

      <button type="button" class="ghost" id="sync-cancel">취소</button>

  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>

<script id="report-data" type="application/json">/*__DATA__*/null</script>
<script>
(function () {
  "use strict";
  var raw = document.getElementById("report-data").textContent;
  var D;
  try { D = JSON.parse(raw); } catch (e) { D = null; }
  var app = document.getElementById("app");
  if (!D) { app.textContent = "브리핑 데이터를 읽지 못했습니다. render-report.py로 데이터를 넣었는지 확인하세요."; return; }

  var STATUS_CHIP = { "완료": "green", "진행 중": "amber", "중단": "red" };
  var TAG_CHIP = { "긴급": "red", "필수": "amber", "이어서": "gray", "검토": "gray" };
  var SEV_RANK = { CRITICAL: 4, MAJOR: 3, WARNING: 2, MINOR: 1, INFO: 0 };
  var WAIT_DAYS = 3; // 기한이 이 일수 안이거나 지난 메일 할 일은 '기한 있는 것' 칸에 올린다
  var WAIT_TIP = "오늘 이어가기와 별개로 기한이 정해진 일입니다. Notion 활성 Task 중 오늘 마감이거나 마감이 지난 지 7일 안인 것, 메일 할 일 중 기한이 " + WAIT_DAYS + "일 안이거나 이미 지난 것을 모읍니다.";

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function chip(text, tone) { return '<span class="chip ' + (tone || "gray") + '">' + esc(text) + "</span>"; }
  function link(url, text) { return url ? '<a href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(text) + "</a>" : ""; }
  function arr(x) { return Array.isArray(x) ? x : []; }
  function sevTone(s) { var r = SEV_RANK[(s || "").toUpperCase()]; return r >= 3 ? "red" : r === 2 ? "amber" : "gray"; }
  function stateTone(s) { return s === "resolved" ? "green" : s === "firing" ? "red" : "amber"; }

  var cmdSeq = 0;
  function resumeHtml(resume) {
    if (!resume) return "";
    if (/^https?:\/\//.test(resume)) return link(resume, resume.replace(/^https?:\/\/(www\.)?github\.com\//, ""));
    var id = "cmd-" + (cmdSeq++);
    return '<div class="cmd"><code id="' + id + '">' + esc(resume) + '</code><button class="copy" type="button" data-target="' + id + '">복사</button></div>';
  }
  // 이어가기 버튼: resolve-launch.py가 계산한 Orca 채팅 실행 명령을 의도별로 복사한다
  var INTENTS = ["구체화", "실행"];
  function launchHtml(t) {
    if (!t.launch) return t.launch_error ? '<div class="launch"><span class="where">이어가기 명령 없음: ' + esc(t.launch_error) + "</span></div>" : "";
    var L = t.launch;
    var where = L.mode === "agent launch"
      ? "열 곳: 기존 워크스페이스 " + L.name
      : "열 곳: 새 워크스페이스 " + L.name + " (지난 워크스페이스가 없어 " + L.target + "에서 새로 만듭니다)";
    var btns = INTENTS.filter(function (k) { return L[k]; }).map(function (k) {
      var id = "cmd-" + (cmdSeq++);
      return '<button class="go copy" type="button" data-target="' + id + '" data-label="' + esc(k) + '로 이어가기">' + esc(k) + "로 이어가기</button>" +
        '<code id="' + id + '" hidden>' + esc(L[k]) + "</code>";
    }).join("");
    return '<div class="launch"><span class="where">' + esc(where) + '</span><div class="btns">' + btns +
      '</div><span class="where">복사한 명령을 터미널에 붙여넣으면 Orca 채팅이 열리고 /task:resume으로 이어집니다</span></div>';
  }
  function prsHtml(prs) {
    return arr(prs).length ? '<div class="prs">' + arr(prs).map(function (p) { return link(p.url, "#" + p.number); }).join("") + "</div>" : "";
  }
  // dl 행: [라벨, html, strong] 중 값이 있는 것만
  function dl(rows) {
    var body = rows.filter(function (r) { return r[1]; }).map(function (r) {
      return "<dt>" + esc(r[0]) + '</dt><dd class="' + (r[2] ? "strong" : "") + '">' + r[1] + "</dd>";
    }).join("");
    return body ? '<dl class="dl">' + body + "</dl>" : "";
  }
  // 완료 체크 키: 어제 스레드에서 온 항목은 스레드 id, 아니면 Top 3 순번. doc id로 쓰므로 영숫자와 하이픈만
  var DONE_KEYS = {}; // key -> title (DB에 함께 저장해 Claude가 읽을 때 무엇인지 알 수 있게)
  var BLOCK_OF = {};  // key -> Notion 일지 to_do 블록 id (상태 반영이 이 블록의 checked만 바꾸거나 pending에 싣는다)
  function doneKey(prefix, id) { return (prefix + "-" + String(id)).replace(/[^A-Za-z0-9-]/g, "-"); }
  // 칸반 상태: todo(할 일) / doing(진행 중) / done(완료). 완료 칸이 곧 완료 체크(item_state.done)다
  var STATUS_LIST = [["todo", "할 일"], ["doing", "진행 중"], ["done", "완료"]];
  var INIT_STATUS = {}; // key -> 렌더 때 정한 초기 상태(저장된 상태가 없을 때 쓴다)
  // kind: "state"(item_state 문서 키) | "item"(board_items 문서 id)
  function statusSel(id, kind, value) {
    return '<select class="status-sel" data-' + kind + '="' + esc(id) + '" aria-label="상태"' + (store ? "" : " disabled") + ' title="상태 바꾸기">' +
      STATUS_LIST.map(function (o) { return '<option value="' + o[0] + '"' + (o[0] === value ? " selected" : "") + ">" + o[1] + "</option>"; }).join("") +
      "</select>";
  }
  // 펼침 항목 하나
  function item(opts) {
    var details = opts.details || "";
    if (opts.key) { DONE_KEYS[opts.key] = opts.title; INIT_STATUS[opts.key] = opts.init || "todo"; }
    var head = '<span class="row"><span class="ttl">' + (details ? '<span class="caret" aria-hidden="true">&#9654;</span>' : "") +
      (opts.rank ? '<span class="rk">' + esc(opts.rank) + "</span>" : "") + esc(opts.title) + "</span>" +
      '<span class="chips">' + (opts.chips || "") + (opts.key ? statusSel(opts.key, "state", opts.init || "todo") : "") + "</span></span>" +
      (opts.sub ? '<span class="s">' + esc(opts.sub) + "</span>" : "");
    var cls = "item" + (opts.first ? " first" : "");
    var keyAttr = opts.key ? ' data-key="' + esc(opts.key) + '" draggable="true"' : "";
    if (!details) return '<div class="' + cls + '"' + keyAttr + '><div class="summary-static" style="padding:10px 12px;display:grid;gap:4px">' + head + "</div></div>";
    return '<details class="' + cls + '"' + keyAttr + (opts.open ? " open" : "") + "><summary>" + head + "</summary>" + details + "</details>";
  }
  // "11-24" 또는 "2026-11-24"를 기준일과의 일수 차이로
  function dayDiff(due) {
    if (!due) return null;
    var m = /(?:(\d{4})-)?(\d{1,2})-(\d{1,2})/.exec(due);
    var b = /(\d{4})-(\d{2})-(\d{2})/.exec(D.date || "");
    if (!m || !b) return null;
    var base = Date.UTC(+b[1], +b[2] - 1, +b[3]);
    var d = Date.UTC(m[1] ? +m[1] : +b[1], +m[2] - 1, +m[3]);
    return Math.round((d - base) / 86400000);
  }
  function dueLabel(diff, due) {
    if (diff == null) return chip(due || "기한 없음");
    if (diff < 0) return chip((-diff) + "일 지남", "red");
    if (diff === 0) return chip("오늘", "red");
    if (diff === 1) return chip("내일", "amber");
    return chip(diff + "일 남음", diff <= WAIT_DAYS ? "amber" : "gray");
  }

  var html = [];

  // 머리
  var st = D.stats || {};
  html.push(
    "<header>" +
      '<div class="eyebrow">DAILY START · ' + esc(D.date) + " (" + esc(D.weekday) + ") · 알럿 시간창 " + esc(D.window) + "</div>" +
      "<h1>" + esc(D.title || "하루 시작") + "</h1>" +
      (Array.isArray(D.headline)
        ? '<ul class="lede-list">' + D.headline.map(function (h) { return "<li>" + esc(h) + "</li>"; }).join("") + "</ul>"
        : '<p class="lede">' + esc(D.headline) + "</p>") +
    "</header>"
  );

  // 긴급
  var urgent = arr(D.urgent);
  var uh = '<section><h2>긴급 대응 <span class="n">' + urgent.length + "건</span></h2>";
  if (urgent.length) {
    uh += '<ul class="urgent-list">' + urgent.map(function (u) {
      return "<li><div><b>" + esc(u.title) + "</b> " + chip(u.severity, sevTone(u.severity)) + " " + chip(u.cluster) + "</div>" +
        '<div class="note">' + esc(u.started_at ? u.started_at + "부터 · " : "") + "왜 긴급: " + esc(u.why) + "</div>" +
        '<div class="note">대응 상황: ' + esc(u.responder || "아직 대응 기록 없음") + " " + link(u.link, "Slack") + "</div></li>";
    }).join("") + "</ul>";
  } else {
    uh += '<p class="calm">' + esc(D.urgent_none || "밤사이 긴급 건 없음") + "</p>";
  }
  html.push(uh + "</section>");

  // 보드 데이터
  var Y = D.yesterday || {};
  var TRK = D.tracking || {}; // work:tracking 전날 기록 요약(없으면 빈 객체)
  var threads = arr(Y.threads);
  var top = arr(D.top3);
  var topIds = top.map(function (t) { return t.thread_id; }).filter(Boolean);
  var openThreads = threads.filter(function (t) { return t.status !== "완료" && topIds.indexOf(t.id) < 0; });
  var doneThreads = threads.filter(function (t) { return t.status === "완료"; });
  var M = D.mail || {};
  var T = D.tasks || {};
  var mailWait = [], mailRest = [];
  arr(M.todos).forEach(function (m) {
    var diff = dayDiff(m.due);
    (diff != null && diff <= WAIT_DAYS ? mailWait : mailRest).push({ m: m, diff: diff });
  });
  mailWait.sort(function (a, b) { return a.diff - b.diff; });

  // 칸반: 카드마다 초기 상태를 정해 그 칸에 그리고, 저장된 상태(item_state.status)가 오면 applyStatus가 칸을 옮긴다
  // 직접 추가한 항목(board_items)은 col(todo | doing | done)로 칸을 정한다
  var COL_NAME = { todo: "할 일", doing: "진행 중", done: "완료" };
  function addBtn(col) { return '<button class="add-btn" type="button" data-add="' + col + '" disabled title="저장소에 연결하는 중">+ 추가</button>'; }
  function userSlot(col) { return '<div class="user-items" data-col="' + col + '"></div>'; }
  var colCards = { todo: [], doing: [], done: [] };

  // 어제 Tomorrow: 항목 하나가 카드 하나(action item). 하위 항목은 카드 안 체크리스트, Top 3와 같은 일이면 칩으로 잇는다
  var TMR = arr(D.tomorrow);
  function subsHtml(subs) {
    return arr(subs).map(function (s) {
      return '<li class="' + (s.done ? "on" : "") + '" style="padding-left:' + ((s.depth || 0) * 14) + 'px">' + esc(s.text) + "</li>";
    }).join("");
  }

  // Top 3: 오늘 집중할 일이라 진행 중에서 시작
  top.forEach(function (t, i) {
    var chips = chip(t.tag, TAG_CHIP[t.tag]) + (t.carry_label ? chip(t.carry_label) : "") + (t.added ? chip("Todos", "green") : "");
    var key = t.thread_id ? doneKey("thread", t.thread_id) : doneKey("top", i + 1);
    if (t.block_id) BLOCK_OF[key] = t.block_id; // append-todos가 돌려준 일지 to_do 블록 id
    colCards.doing.push(item({
      rank: (i + 1) + ".", title: t.title, chips: chips, sub: t.next_action, first: i === 0, open: i === 0,
      key: key, init: "doing",
      details: dl([
        ["멈춘 곳", esc(t.stopped_at)],
        ["첫 행동", esc(t.next_action), true],
        ["완료 조건", esc(t.done_when)],
        ["회고 기록", esc(t.tracking_note)],
        ["이유", esc(t.reason)],
        ["재개", resumeHtml(t.resume)]
      ]) + launchHtml(t)
    }));
  });
  // 어제 Tomorrow: 할 일 칸 카드. 할 일 칸 맨 앞에 둔다(사용자가 어제 정한 오늘 할 일)
  TMR.slice().reverse().forEach(function (x, ri) {
    var i = TMR.length - 1 - ri;

    var subs = arr(x.subs);
    var left = subs.filter(function (s) { return !s.done; }).length;
    var progress = subs.length ? "하위 " + subs.length + "개 중 " + (subs.length - left) + "개 완료" : "";

      title: x.text,
      chips: chip("Tomorrow") + (x.related_top ? chip(x.related_top + "순위와 연결") : "") + (x.added ? chip("Todos", "green") : ""),

    }));
  });
  // 그 밖에 열린 스레드: 진행 중이면 진행 중, 중단이면 할 일
  openThreads.forEach(function (t) {
    var init = t.status === "중단" ? "todo" : "doing";
    colCards[init].push(item({
      title: t.title, chips: chip(t.status, STATUS_CHIP[t.status]), sub: t.next_action || t.follow_up,
      key: doneKey("thread", t.id), init: init,
      details: dl([
        ["프로젝트", esc(t.project)],
        ["멈춘 곳", esc(t.stopped_at)],
        ["다음 행동", esc(t.next_action), true],
        ["한 일", esc(t.done)],
        ["후속", esc(t.follow_up)],
        ["재개", resumeHtml(t.resume)],
        ["PR", prsHtml(t.prs)],
        ["근거", esc(t.evidence)]
      ]) + launchHtml(t)
    }));
  });
  // 마감 Task, 기한 임박 메일: 할 일에서 시작하고 마감 칩을 단다
  arr(T.due).forEach(function (t, i) {
    colCards.todo.push(item({
      title: t.name, chips: dueLabel(-(t.overdue_days || 0)), sub: "Task" + (t.linked_thread ? " · 이어가기와 연결" : " · 이어가기와 연결 없음"),
      key: doneKey("task", t.page_id ? String(t.page_id).replace(/-/g, "").slice(0, 8) : i + 1), init: "todo",
      details: dl([["마감", esc(t.due)], ["연결", t.linked_thread ? "오늘 이어가기 항목과 같은 일" : "오늘 이어가기와 연결 없음"]])

    }));

  // 어제 끝낸 스레드: 완료 칸 아래 접힌 묶음(옮기지 않는다)
  var yday = doneThreads.map(function (t) {

      title: t.title, chips: n ? chip("PR " + n, "green") : "", sub: t.follow_up ? "후속: " + t.follow_up : t.project,
      details: dl([["프로젝트", esc(t.project)], ["한 일", esc(t.done)], ["후속", esc(t.follow_up)], ["PR", prsHtml(t.prs)]])
    });
  }).join("");
  var ydayHtml = doneThreads.length
    ? '<details class="yday"><summary>어제 끝낸 스레드 ' + doneThreads.length + "</summary>" + yday + "</details>"
    : '<p class="note">' + (threads.length ? "어제 완료로 판정된 스레드가 없습니다." : "어제 세션 기록이 없습니다.") + "</p>";

  function colHtml(st, extra) {
    return '<div class="col col-' + st + '" data-status="' + st + '"><div class="col-head"><h3>' + COL_NAME[st] + '</h3><span class="head-r">' +

      '<div class="cards" data-cards="' + st + '">' + colCards[st].join("") + "</div>" + userSlot(st) + (extra || "") + "</div>";
  }
  var bnotes = [];
  if (D.compare) bnotes.push("비교: " + D.compare);
  if (T.overdue_old_count) bnotes.push("7일 넘게 지난 Task " + T.overdue_old_count + "건");
  if (T.in_progress_count) bnotes.push("진행 중 Task " + T.in_progress_count + "건" + (arr(T.in_progress_top).length ? ": " + arr(T.in_progress_top).join(", ") : ""));

  html.push(
    "<section>" +
      '<h2>오늘 보드 <span class="n">' + esc(Y.date || "") + " 기준 · 스레드 " + threads.length + "개" +
        (Y.minor_sessions ? " · 짧은 질문 세션 " + esc(Y.minor_sessions) + "개 제외" : "") + "</span></h2>" +
      '<div class="toolbar"><span class="sync-hint" id="sync-hint"></span>' +
        '<button type="button" class="sync-open" id="sync-open" disabled title="claude.ai에서 열었을 때만 쓸 수 있습니다">상태 반영하기</button>' +
        '<button type="button" data-acc="open">모두 펼치기</button><button type="button" data-acc="close">모두 접기</button></div>' +
      '<p class="note">카드를 끌어 칸을 옮기거나 카드의 상태 메뉴로 바꿉니다. 완료 칸으로 옮긴 Top 3·스레드는 상태 반영하기로 일지에 체크합니다.</p>' +
      (TRK.artifact_url ? '<p class="note">어제 회고 트리: 이어서 할 일 ' + esc(TRK.next_count || 0) + "건" +

      '<div class="board">' + colHtml("todo") + colHtml("doing") + colHtml("done", ydayHtml) + "</div>" +
      bnotes.map(function (n) { return '<p class="note">' + esc(n) + "</p>"; }).join("") +
    "</section>"
  );

  // 회고 대조
  // tomorrow 필드가 있으면 Tomorrow 항목은 보드에 있으므로 여기서 뺀다. 출처 순서로 묶어 표로 보인다
  var RETRO_ORDER = { "미체크": 0, "Try": 1, "코치": 2, "고민": 3, "Tomorrow": 4 };
  var retro = arr(D.retro_notes).filter(function (r) { return !(TMR.length && r.source === "Tomorrow"); })
    .sort(function (a, b) { return (RETRO_ORDER[a.source] == null ? 9 : RETRO_ORDER[a.source]) - (RETRO_ORDER[b.source] == null ? 9 : RETRO_ORDER[b.source]); });
  if (retro.length) {

      '<div class="table-wrap"><table><thead><tr><th>출처</th><th>항목</th><th>판정</th></tr></thead><tbody>' + retro.map(function (r) {

      }).join("") + "</tbody></table></div></section>");
  }

  // 알럿
  var A = D.alerts || {};

  if (arr(A.hourly).length) {
    ah += hourlySvg(arr(A.hourly));

  }
  var check = arr(A.check);
  if (check.length) {
    ah += '<div class="table-wrap"><table><thead><tr><th>시작</th><th>클러스터</th><th>내용</th><th>상태</th><th></th></tr></thead><tbody>' +
      check.map(function (c) {
        var body = c.kind === "burst" ? "<b>동시 다발 " + arr(c.members).length + "건</b>: " + esc(arr(c.members).join(", ")) : "<b>" + esc(c.title) + "</b> " + chip(c.severity, sevTone(c.severity));
        return '<tr><td class="mono">' + esc(c.started_at) + "</td><td>" + esc(c.cluster) + "</td><td>" + body +
          (c.detail ? '<div class="note">' + esc(c.detail) + "</div>" : "") + "</td><td>" + chip(c.state, stateTone(c.state)) + "</td><td>" + link(c.link, "Slack") + "</td></tr>";
      }).join("") + "</tbody></table></div>";
  } else {
    ah += '<p class="note">확인이 필요한 알럿이 없습니다.</p>';
  }
  html.push(ah + "</section>");

  // 메일(보드에 안 올라간 것)과 근본 원인 후보
  var mh = '<section><div class="two"><div><h2>메일 <span class="n">할 일 ' + arr(M.todos).length + "건 중 보드 밖 " + mailRest.length + "건 · 보관 " + esc(M.archived_count || 0) + "건</span></h2>";
  mh += mailRest.length ? '<ul class="plain">' + mailRest.map(function (w) {
    return "<li>" + esc(w.m.todo) + ' <span class="note">' + esc(w.m.from) + (w.m.due ? " · ~" + esc(w.m.due) : "") + "</span> " + link(w.m.link, "메일") + "</li>";

  var NOTION = "host:notion-personal";

  (function connectNotion() {

  function notionCall(tool, input) {
    return mcp.callTool(NOTION, tool, input, { cache: false }).then(function (res) {
      var p = res && res.payload;

  }
  function whereText(p) {
    if (p.direct) return "확정하면 바로 일지 할 일을 " + (p.want ? "체크합니다" : "체크 해제합니다");
    if (p.block) return "확정하면 반영 대기로 남습니다(Claude 앱에서 열면 바로 반영, 아니면 세션에 \"반영해\")";
    return "일지 할 일과 연결된 블록이 없어 반영 대기로 남습니다(세션의 \"반영해\"가 뜻으로 맞춰 체크)";
  }
  function renderCards() {
    if (!plan.length) { sCards.innerHTML = '<div class="empty">반영할 변경이 없습니다. 보드의 완료 체크와 일지 반영 기록이 모두 같습니다.</div>'; return; }
    sCards.innerHTML = plan.map(function (p, i) {
      var tag = p.state === "done" ? chip("일지 반영됨", "green")
        : p.state === "queued" ? chip("반영 대기로 확정", "amber")
        : p.state === "fail" ? chip("실패", "red")
        : p.busy ? chip("처리 중", "gray")
        : p.pending ? chip("반영 대기", "amber") : "";
      return '<div class="sync-card' + (p.state ? " off" : "") + '">' +
        '<div class="top"><label for="sync-inc-' + i + '"><input type="checkbox" id="sync-inc-' + i + '" data-inc="' + i + '"' +
          (p.include ? " checked" : "") + (p.state || p.busy ? " disabled" : "") + ">" + esc(p.title) + "</label>" +
          '<span class="chips">' + diffHtml(p) + tag + "</span></div>" +
        '<div class="journal">' + esc(whereText(p)) + "</div>" +
        (p.result ? '<div class="result' + (p.state === "fail" ? " err" : "") + '">' + esc(p.result) + "</div>" : "") +
        "</div>";
    }).join("");
  }
  function updateApply() {
    var n = plan.filter(function (p) { return p.include && !p.state; }).length;
    sApply.disabled = !n || !store;
    sApply.textContent = n ? "반영 확정 (" + n + ")" : "반영 확정";
  }
  function openSync() {
    if (!store) return;
    sErr.hidden = true; sCancel.textContent = "취소"; sCancel.disabled = false;
    plan = candidates();
    sSub.textContent = !plan.length ? "" : mcp
      ? "보드 완료 체크와 일지가 다른 항목 " + plan.length + "건입니다. 고른 카드를 확정하면 바로 일지에 반영합니다. 확정 전에는 아무것도 쓰지 않습니다"
      : "보드 완료 체크와 일지가 다른 항목 " + plan.length + "건입니다. 확정하면 '반영 대기'로 남고, Claude 앱에서 열거나 세션에 \"반영해\"라고 하면 일지에 체크합니다";
    renderCards(); updateApply();
    sModal.hidden = false;
  }
  function closeSync() { if (sApply.getAttribute("data-busy")) return; sModal.hidden = true; plan = []; }
  function baseRec(p) {
    var prev = stateDocs[p.key] || {};
    var rec = {};
    Object.keys(prev).forEach(function (k) { rec[k] = prev[k]; });
    rec.key = p.key; rec.title = p.title; rec.done = p.want; rec.date = rec.date || D.date;
    if (rec.doneAt === undefined) rec.doneAt = p.want ? Date.now() : null;
    return rec;
  }
  function writePending(p) {
    var rec = baseRec(p);
    rec.pending = { daily: p.want, block: p.block, at: new Date().toISOString() };
    return store.collection(STATE).doc(p.key).set(rec);
  }
  function writeLedger(p) {
    var rec = baseRec(p);
    delete rec.pending;
    rec.ledger = { daily: p.want, block: p.block, at: new Date().toISOString(), via: "board" };
    return store.collection(STATE).doc(p.key).set(rec);
  }
  function applyOne(p) {
    if (!p.direct) {
      return writePending(p).then(function () {
        p.state = "queued"; p.pending = true;
        p.result = mcp ? "블록이 없어 세션의 \"반영해\"로 처리합니다" : "Claude 앱에서 열어 다시 확정하거나, 세션에 \"반영해\"라고 하면 일지에 반영합니다";
      }, function (e) {
        p.state = "fail"; p.result = "저장하지 못했습니다" + (e && e.code ? " (" + e.code + ")" : "") + ". 편집 권한이 있는지 확인해 주세요";
      });
    }
    return notionCall("API-update-a-block", { block_id: p.block, to_do: { checked: p.want }, archived: false }).then(function (b) {
      if (!b.to_do || !!b.to_do.checked !== p.want || b.archived || b.in_trash) throw { code: "tool_error", message: "반영 후 상태가 기대와 다릅니다. 일지를 직접 확인하세요" };
      return writeLedger(p).then(function () {
        p.state = "done"; p.result = p.want ? "일지 할 일을 체크했습니다" : "일지 할 일 체크를 풀었습니다";
      }, function () {
        p.state = "fail"; p.result = "일지는 바꿨지만 보드 기록을 남기지 못했습니다. 다시 확정하면 기록만 맞춥니다";
      });
    }, function (e) { p.state = "fail"; p.result = errText(e); });
  }
  function applySync() {
    var todo = plan.filter(function (p) { return p.include && !p.state; });
    if (!todo.length || !store) return;
    sApply.setAttribute("data-busy", "1"); sApply.disabled = true; sApply.textContent = "반영 중"; sCancel.disabled = true;
    todo.forEach(function (p) { p.busy = true; });
    renderCards();
    // 한 건씩 차례로: 앱이 쓰기마다 확인 창을 띄울 수 있고, 실패한 카드만 따로 보이기 위해서다
    todo.reduce(function (chain, p) {
      return chain.then(function () { return applyOne(p); }).then(function () { p.busy = false; renderCards(); });
    }, Promise.resolve()).then(function () {
      sApply.removeAttribute("data-busy"); sCancel.disabled = false; sCancel.textContent = "닫기";
      updateApply(); refreshSyncBar();
    });
  }
  syncOpen.addEventListener("click", openSync);
  sCancel.addEventListener("click", closeSync);
  sApply.addEventListener("click", applySync);
  sModal.addEventListener("click", function (ev) { if (ev.target === sModal) closeSync(); });
  sCards.addEventListener("change", function (ev) {
    var i = ev.target.getAttribute && ev.target.getAttribute("data-inc");
    if (i == null || !plan[+i]) return;
    plan[+i].include = ev.target.checked; updateApply();
  });
  document.addEventListener("keydown", function (ev) { if (!sModal.hidden && ev.key === "Escape") closeSync(); });

  app.addEventListener("click", function (ev) {
    var acc = ev.target.closest && ev.target.closest("[data-acc]");
    if (acc) {
      var open = acc.getAttribute("data-acc") === "open";
      app.querySelectorAll(".board details.item").forEach(function (d) { d.open = open; });
      return;
    }
    var btn = ev.target.closest && ev.target.closest(".copy");
    if (!btn) return;
    ev.preventDefault();
    var el = document.getElementById(btn.getAttribute("data-target"));
    if (!el) return;
    var text = el.textContent;
    var label = btn.getAttribute("data-label") || "복사";
    function selectFallback() {
      el.hidden = false;
      var r = document.createRange(); r.selectNodeContents(el);
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
      btn.textContent = "선택됨";
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { btn.textContent = "복사됨"; }, selectFallback);
    } else { selectFallback(); }
    setTimeout(function () { btn.textContent = label; }, 1600);
  });

  // 밤사이 시간대별 알럿: 열림은 빨강, 해결은 회색으로 쌓는다
  function hourlySvg(hs) {
    var W = 940, H = 170, left = 30, bottom = 24, top = 14;
    var n = hs.length, slot = (W - left - 8) / n, bw = Math.min(34, slot * 0.62);
    var max = Math.max.apply(null, hs.map(function (h) { return (h.open || 0) + (h.resolved || 0); }).concat([1]));
    var step = max <= 5 ? 1 : max <= 10 ? 2 : max <= 25 ? 5 : 10;
    var ymax = Math.ceil(max / step) * step;
    function y(v) { return H - bottom - v / ymax * (H - bottom - top); }
    var g = ['<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="시간대별 알럿 수">'];
    for (var v = 0; v <= ymax; v += step) {
      g.push('<line x1="' + left + '" y1="' + y(v) + '" x2="' + (W - 8) + '" y2="' + y(v) + '" stroke="#eef1f5" stroke-width="1"/>');
      g.push('<text x="' + (left - 6) + '" y="' + (y(v) + 3) + '" font-size="10" fill="#5d6b7a" text-anchor="end">' + v + "</text>");
    }
    hs.forEach(function (h, i) {
      var cx = left + slot * i + slot / 2, x0 = cx - bw / 2;
      var res = h.resolved || 0, open = h.open || 0;
      if (res) g.push('<rect x="' + x0 + '" y="' + y(res) + '" width="' + bw + '" height="' + (y(0) - y(res)) + '" fill="#b8c3cf"><title>' + esc(h.hour) + "시 해결 " + res + "</title></rect>");
      if (open) g.push('<rect x="' + x0 + '" y="' + y(res + open) + '" width="' + bw + '" height="' + (y(res) - y(res + open)) + '" fill="#c4584d"><title>' + esc(h.hour) + "시 열림 " + open + "</title></rect>");
      if ((SEV_RANK[(h.max_severity || "").toUpperCase()] || 0) >= 3) g.push('<circle cx="' + cx + '" cy="' + (y(res + open) - 7) + '" r="3" fill="#b42318"/>');
      g.push('<text x="' + cx + '" y="' + (H - 8) + '" font-size="10" fill="#5d6b7a" text-anchor="middle">' + esc(h.hour) + "</text>");
    });
    g.push("</svg>");
    return '<div class="chart">' + g.join("") + "</div>";
  }
})();
</script>
